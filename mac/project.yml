name: Connect
options:
  bundleIdPrefix: com.connect.app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Connect:
    type: application
    platform: macOS
    sources:
      - path: Connect
        excludes:
          - "Resources/Info.plist"
          - "Resources/Connect.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connect.app.Connect
        PRODUCT_NAME: Connect
        INFOPLIST_FILE: Connect/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Connect/Resources/Connect.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  ConnectTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ConnectTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connect.app.ConnectTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Connect

schemes:
  Connect:
    build:
      targets:
        Connect: all
        ConnectTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ConnectTests
    archive:
      config: Release
