name: Connect
options:
  bundleIdPrefix: com.connect.app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Connect:
    type: application
    platform: macOS
    sources:
      - path: Connect
        excludes:
          - "Resources/Info.plist"
          - "Resources/Connect.entitlements"
          - "Resources/bin/**"
      - path: Connect/Resources/bin
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Make bundled adb/scrcpy executable
        script: |
          set -e
          BIN_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin"
          if [ -d "$BIN_DIR" ]; then
            chmod +x "$BIN_DIR/adb" "$BIN_DIR/scrcpy" 2>/dev/null || true
            find "$BIN_DIR/scrcpy-libs" -type f -exec chmod +x {} \; 2>/dev/null || true
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connect.app.Connect
        PRODUCT_NAME: Connect
        INFOPLIST_FILE: Connect/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Connect/Resources/Connect.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  ConnectTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ConnectTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connect.app.ConnectTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Connect

schemes:
  Connect:
    build:
      targets:
        Connect: all
        ConnectTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ConnectTests
    archive:
      config: Release
