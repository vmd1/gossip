name: Gossip
options:
  bundleIdPrefix: dev.vmd1.gossip
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Gossip:
    type: application
    platform: macOS
    sources:
      - path: Gossip
        excludes:
          - "Resources/Info.plist"
          - "Resources/Gossip.entitlements"
      - path: Shared
    dependencies:
      # The "Device Mirroring" launcher rides inside Gossip.app (Contents/SharedSupport) and is copied
      # out next to it on first run — see LauncherInstaller.
      - target: DeviceMirroring
        embed: true
        codeSign: true
        copy:
          destination: sharedSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vmd1.gossip.Gossip
        PRODUCT_NAME: Gossip
        INFOPLIST_FILE: Gossip/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Gossip/Resources/Gossip.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  DeviceMirroring:
    type: application
    platform: macOS
    sources:
      - path: DeviceMirroringLauncher
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vmd1.gossip.DeviceMirroring
        PRODUCT_NAME: Device Mirroring
        INFOPLIST_FILE: DeviceMirroringLauncher/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  GossipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GossipTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vmd1.gossip.GossipTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Gossip

schemes:
  Gossip:
    build:
      targets:
        Gossip: all
        GossipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GossipTests
    archive:
      config: Release
