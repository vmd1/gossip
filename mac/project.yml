name: Gossip
options:
  bundleIdPrefix: dev.vmd1.gossip
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Gossip:
    type: application
    platform: macOS
    sources:
      - path: Gossip
        excludes:
          - "Resources/Info.plist"
          - "Resources/Gossip.entitlements"
          - "Resources/bin/**"
      - path: Gossip/Resources/bin
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Make bundled adb/scrcpy executable
        script: |
          set -e
          BIN_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin"
          if [ -d "$BIN_DIR" ]; then
            chmod +x "$BIN_DIR/adb" "$BIN_DIR/scrcpy" 2>/dev/null || true
            find "$BIN_DIR/scrcpy-libs" -type f -exec chmod +x {} \; 2>/dev/null || true
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vmd1.gossip.Gossip
        PRODUCT_NAME: Gossip
        INFOPLIST_FILE: Gossip/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Gossip/Resources/Gossip.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  GossipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GossipTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vmd1.gossip.GossipTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Gossip

schemes:
  Gossip:
    build:
      targets:
        Gossip: all
        GossipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GossipTests
    archive:
      config: Release
