name: Release

# Runs only on a push to main that changes something shippable (app code, the wire schema, or
# this workflow) — a docs-only merge no longer burns a macOS + Android release build. Tests run
# on the pull request (android.yml / mac.yml), not again here. workflow_dispatch cuts a release
# manually without an empty push.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "mac/**"
      - "schema/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Releases are never cancelled mid-flight (a half-published release is worse than a queued one),
# but pushes landing while one runs queue behind it instead of racing.
concurrency:
  group: release
  cancel-in-progress: false

# Needed for `gh release create` to push a release using the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # No semantic-versioning scheme exists anywhere in this repo yet and this project
      # has no external users, so a date + run-number tag is the simplest thing that's
      # actually unique across repeated same-day pushes to main, per the handoff's own
      # "simplest starting point... rather than inventing semantic versioning" guidance.
      - id: tag
        run: echo "tag=v$(date -u +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  android-release:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The signing key lives in this environment, which is restricted to the main branch (see
    # android/scripts/signing.sh). Nothing else in this repo can read it.
    environment: release
    env:
      # SHA-256 of the project signing certificate (public information). The build fails if the APK is signed by
      # anything else, so a release can never silently break in-place updates on installed devices.
      EXPECTED_ANDROID_CERT_SHA256: "092f9e34db305f55a2f638128753e71a28d111bcaa741784531df39f60101101"
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Signed with the project's stable key (the same one local builds use, android/scripts/signing.sh) so this
      # APK updates an installed Gossip in place: Android refuses an update signed with a different key, and a
      # fresh runner would otherwise generate a new debug keystore every time. It is still a *debug* build type
      # signed with a self-made key, not a Play Store release key.
      - name: Install signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gossip-android.keystore"
          echo "GOSSIP_ANDROID_KEYSTORE=$RUNNER_TEMP/gossip-android.keystore" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        env:
          GOSSIP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOSSIP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOSSIP_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      # Fail the release if the APK is not signed by the project key.
      - name: Verify signature
        run: |
          set -uo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          OUT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk 2>&1)" \
            || { echo "$OUT"; echo "::error::apksigner could not verify the APK"; exit 1; }
          echo "$OUT" | grep -E "Signer #1 certificate (DN|SHA-256)" || echo "$OUT"
          echo "$OUT" | grep -qi "SHA-256 digest: $EXPECTED_ANDROID_CERT_SHA256" \
            || { echo "::error::APK is not signed by the project key"; exit 1; }

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gossip-android.keystore"

      # No ABI splits configured (app/build.gradle.kts) — this is a single universal APK
      # bundling all ABIs, not an arch-specific build.
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Gossip-Android-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/Gossip-Android-universal.apk

  mac-release:
    needs: version
    runs-on: macos-15
    timeout-minutes: 25
    # The signing key lives in this environment, which is restricted to the main branch (see
    # mac/scripts/set-ci-signing-secrets.sh). Nothing else in this repo can read it.
    environment: release
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Signed with the project's stable self-signed identity (gossip.vmd1.dev), the same one local builds use
      # (mac/scripts/create-signing-cert.sh), so macOS keeps users' Accessibility / Input Monitoring grants
      # across updates: those grants are tied to the code signature, and an ad-hoc signature changes on every
      # build. It is NOT a Developer ID and the app is not notarized, so Gatekeeper still blocks a downloaded
      # copy until the user opens it via System Settings -> Privacy & Security -> Open Anyway.
      # The key is imported into a throwaway keychain that is deleted at the end of the job.
      - name: Import signing certificate
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/gossip-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Build (signed Release)
        run: >
          xcodebuild
          -project Gossip.xcodeproj
          -scheme Gossip
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath build
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=gossip.vmd1.dev
          DEVELOPMENT_TEAM=
          "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN"
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES
          build

      # Fail the release if the app came out ad-hoc signed or with a different identity.
      - name: Verify signature
        run: |
          APP=build/Build/Products/Release/Gossip.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          echo "$INFO" | grep -E "Identifier|Authority|Signature|TeamIdentifier"
          if echo "$INFO" | grep -q "Signature=adhoc"; then echo "::error::app is ad-hoc signed"; exit 1; fi
          echo "$INFO" | grep -q "Authority=gossip.vmd1.dev" || { echo "::error::app not signed by gossip.vmd1.dev"; exit 1; }
          echo "Designated requirement (this must stay the same release to release):"
          codesign -d -r- "$APP" 2>&1 | grep designated

      # macos-15 runners are Apple Silicon (arm64) only — no Intel build is produced.
      - name: Zip app bundle
        run: |
          cd build/Build/Products/Release
          zip -r ../../../../Gossip-Mac-AppleSilicon.zip Gossip.app

      - uses: actions/upload-artifact@v4
        with:
          name: mac-zip
          path: mac/Gossip-Mac-AppleSilicon.zip

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

  publish:
    needs: [version, android-release, mac-release]
    # A manual run on another branch (e.g. to test signing) builds everything but never creates a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            artifacts/android-apk/*.apk \
            artifacts/mac-zip/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes
