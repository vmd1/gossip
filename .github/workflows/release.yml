name: Release

# Runs only on push to main. Tests run on every branch including main (android-test.yml/
# mac-test.yml); the non-main debug build+upload (android-build.yml/mac-build.yml) is
# deliberately skipped on main, since this workflow is main's build — it builds+publishes
# the actual release artifacts on top of that, gated to main only. workflow_dispatch is
# included so a release can be cut manually without an empty push.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed for `gh release create` to push a release using the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # No semantic-versioning scheme exists anywhere in this repo yet and this project
      # has no external users, so a date + run-number tag is the simplest thing that's
      # actually unique across repeated same-day pushes to main, per the handoff's own
      # "simplest starting point... rather than inventing semantic versioning" guidance.
      - id: tag
        run: echo "tag=v$(date -u +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  android-release:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Debug-signed, not a real release signing key — there is no signing key configured
      # anywhere in this repo, and generating/storing one is out of scope for this change.
      # Fine for this project's own personal use (side-loaded via `adb install`/direct APK
      # download), NOT fine if this project ever needs real Play Store or wider
      # distribution — flagging explicitly here and in the PR rather than silently
      # treating this as solved.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with release tag
        run: cp app/build/outputs/apk/debug/app-debug.apk "gossip-${{ needs.version.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/gossip-${{ needs.version.outputs.tag }}.apk

  mac-release:
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Ad-hoc signed ("Sign to Run Locally"), matching this project's existing local-dev
      # signing approach (see IdentityKeyStore.swift's doc comment) — there is no paid
      # Apple Developer ID configured for this project. CODE_SIGN_STYLE=Manual +
      # CODE_SIGN_IDENTITY=- overrides project.yml's `Automatic` style, which would
      # otherwise require a real team/account that CI doesn't have. The resulting .app is
      # runnable locally but not notarized, so macOS Gatekeeper will quarantine-block it
      # on first launch until the user right-click-opens it once (or runs
      # `xattr -cr Gossip.app`) — expected and acceptable for an unsigned personal build,
      # not a bug in this workflow.
      - name: Build (ad-hoc signed Release)
        run: >
          xcodebuild
          -project Gossip.xcodeproj
          -scheme Gossip
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath build
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=YES
          build

      - name: Zip app bundle
        run: |
          cd build/Build/Products/Release
          zip -r "../../../../gossip-${{ needs.version.outputs.tag }}.zip" Gossip.app

      - uses: actions/upload-artifact@v4
        with:
          name: mac-zip
          path: mac/gossip-${{ needs.version.outputs.tag }}.zip

  publish:
    needs: [version, android-release, mac-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            artifacts/android-apk/*.apk \
            artifacts/mac-zip/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes
