name: Release

# A release is cut when the `VERSION` file changes on main (MAJOR.MINOR, e.g. `1.1`): the tag is `v<VERSION>`.
# Merges to main that leave VERSION alone ship nothing. Tests run on the pull request (android.yml / mac.yml),
# not again here. workflow_dispatch re-runs the release for the VERSION currently on main, e.g. after a failed run
# (it refuses if that version's tag already exists).
on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:

# Releases are never cancelled mid-flight (a half-published release is worse than a queued one),
# but pushes landing while one runs queue behind it instead of racing.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege: the build jobs (which hold the signing keys) only read. Only `publish` may write.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.ver.outputs.number }}
      tag: ${{ steps.ver.outputs.tag }}
      title: ${{ steps.ver.outputs.title }}
    steps:
      # The release version comes from the VERSION file (MAJOR.MINOR). The tag is `v<VERSION>`; a version whose tag
      # already exists is refused, so the same version can never be published twice. Bump the minor for a normal
      # release and the major for a wire-protocol break (every device must run the same version; version-check.yml
      # enforces the major bump when schema/ changes).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be MAJOR.MINOR (got '$v')"; exit 1; }
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$v" >/dev/null 2>&1; then
            echo "::error::v$v is already released; bump VERSION to release again"
            exit 1
          fi
          echo "Releasing v$v"
          echo "number=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "title=Gossip $v ($(date -u +%Y-%m-%d))" >> "$GITHUB_OUTPUT"

  android-release:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The signing key lives in this environment, which is restricted to the main branch (see
    # android/scripts/signing.sh). Nothing else in this repo can read it.
    environment: release
    env:
      # SHA-256 of the project signing certificate (public information). The build fails if the APK is signed by
      # anything else, so a release can never silently break in-place updates on installed devices.
      EXPECTED_ANDROID_CERT_SHA256: "092f9e34db305f55a2f638128753e71a28d111bcaa741784531df39f60101101"
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # The app's protocol engine is the Rust core (desktop/core); Gradle builds it for all four ABIs with the NDK that
      # ships on the runner (scripts/build-android.sh).
      - name: Set up the Rust toolchain for the protocol engine
        working-directory: desktop
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The `release` build type, not `debug`: it is not debuggable, its log statements for debug/info are compiled out
      # (util/Log.kt) and the developer adb hooks are not registered. Signed with the project's stable key (the same
      # one local builds use, android/scripts/signing.sh) so this APK updates an installed Gossip in place: Android
      # refuses an update signed with a different key. It is a self-made key, not a Play Store release key.
      - name: Install signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gossip-android.keystore"
          echo "GOSSIP_ANDROID_KEYSTORE=$RUNNER_TEMP/gossip-android.keystore" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          GOSSIP_RELEASE_NUMBER: ${{ needs.version.outputs.number }}
          GOSSIP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOSSIP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOSSIP_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Fail the release if the APK is not signed by the project key.
      - name: Verify signature
        run: |
          set -uo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          OUT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>&1)" \
            || { echo "$OUT"; echo "::error::apksigner could not verify the APK"; exit 1; }
          echo "$OUT" | grep -E "Signer #1 certificate (DN|SHA-256)" || echo "$OUT"
          echo "$OUT" | grep -qi "SHA-256 digest: $EXPECTED_ANDROID_CERT_SHA256" \
            || { echo "::error::APK is not signed by the project key"; exit 1; }

      # The shipped app must not be debuggable (a debuggable app exposes its private data to `adb run-as`).
      - name: Verify the APK is not debuggable
        run: |
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          if "$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | grep -q "application-debuggable"; then
            echo "::error::the release APK is debuggable"; exit 1
          fi
          echo "APK is not debuggable"

      # The app must carry this release's number (shown in Android's app info).
      - name: Verify version
        env:
          RELEASE_NUMBER: ${{ needs.version.outputs.number }}
        run: |
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | grep -o "versionName='[^']*'"
          "$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | grep -q "versionName='$RELEASE_NUMBER'" \
            || { echo "::error::APK versionName is not $RELEASE_NUMBER"; exit 1; }

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gossip-android.keystore"

      # No ABI splits configured (app/build.gradle.kts) — this is a single universal APK
      # bundling all ABIs, not an arch-specific build.
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Gossip-Android-universal.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: android/Gossip-Android-universal.apk

  mac-release:
    needs: version
    runs-on: macos-15
    timeout-minutes: 25
    # The signing key lives in this environment, which is restricted to the main branch (see
    # mac/scripts/set-ci-signing-secrets.sh). Nothing else in this repo can read it.
    environment: release
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # The app's protocol engine is the Rust core (desktop/core), consumed as a local Swift package. Built for both Mac
      # architectures because the Release configuration links both (the package must contain every slice the app links).
      - name: Build the protocol engine
        run: |
          (cd ../desktop && (rustup show active-toolchain || rustup toolchain install) && rustup target add aarch64-apple-darwin x86_64-apple-darwin)
          scripts/build-core.sh --universal

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Signed with the project's stable self-signed identity (gossip.vmd1.dev), the same one local builds use
      # (mac/scripts/create-signing-cert.sh), so macOS keeps users' Accessibility / Input Monitoring grants
      # across updates: those grants are tied to the code signature, and an ad-hoc signature changes on every
      # build. It is NOT a Developer ID and the app is not notarized, so Gatekeeper still blocks a downloaded
      # copy until the user opens it via System Settings -> Privacy & Security -> Open Anyway.
      # The key is imported into a throwaway keychain that is deleted at the end of the job.
      - name: Import signing certificate
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/gossip-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Build (signed Release)
        run: >
          xcodebuild
          -project Gossip.xcodeproj
          -scheme Gossip
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath build
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=gossip.vmd1.dev
          DEVELOPMENT_TEAM=
          "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN"
          MARKETING_VERSION=${{ needs.version.outputs.number }}
          CURRENT_PROJECT_VERSION=${{ needs.version.outputs.number }}
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES
          build

      # Fail the release if the app came out ad-hoc signed or with a different identity.
      - name: Verify signature
        run: |
          APP=build/Build/Products/Release/Gossip.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          echo "$INFO" | grep -E "Identifier|Authority|Signature|TeamIdentifier"
          if echo "$INFO" | grep -q "Signature=adhoc"; then echo "::error::app is ad-hoc signed"; exit 1; fi
          echo "$INFO" | grep -q "Authority=gossip.vmd1.dev" || { echo "::error::app not signed by gossip.vmd1.dev"; exit 1; }
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "App version: $VERSION"
          [ "$VERSION" = "${{ needs.version.outputs.number }}" ] || { echo "::error::app version $VERSION is not ${{ needs.version.outputs.number }}"; exit 1; }
          echo "Designated requirement (this must stay the same release to release):"
          codesign -d -r- "$APP" 2>&1 | grep designated

      # macos-15 runners are Apple Silicon (arm64) only — no Intel build is produced.
      - name: Zip app bundle
        run: |
          cd build/Build/Products/Release
          zip -r ../../../../Gossip-Mac-AppleSilicon.zip Gossip.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-zip
          path: mac/Gossip-Mac-AppleSilicon.zip

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

  publish:
    needs: [version, android-release, mac-release]
    # A manual run on another branch (e.g. to test signing) builds everything but never creates a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release create`
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TITLE: ${{ needs.version.outputs.title }}
        run: |
          gh release create "$TAG" \
            artifacts/android-apk/*.apk \
            artifacts/mac-zip/*.zip \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes
