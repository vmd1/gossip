name: Mac

on:
  push:
    # Every branch, not just main — see CLAUDE.md/the CI handoff: build+test must run on
    # every push, with an additional release step gated separately (release.yml) on main
    # specifically.
    paths:
      - "mac/**"
      - "schema/**"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "mac/**"
      - "schema/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: >
          xcodebuild
          -project Gossip.xcodeproj
          -scheme Gossip
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test
        run: >
          xcodebuild
          -project Gossip.xcodeproj
          -scheme Gossip
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          test

      # Unsigned (CODE_SIGNING_ALLOWED=NO above) — this is a build-verification artifact
      # for every push/PR, not a distributable release; release.yml's ad-hoc-signed
      # Release build on push to main is the one meant to actually be run outside CI.
      - name: Zip built app bundle
        run: |
          cd build/Build/Products/Debug
          zip -r ../../../../gossip-debug.zip Gossip.app

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: gossip-debug-app
          path: mac/gossip-debug.zip
