name: Version check

# Keeps VERSION honest. Every device in the mesh must run the same version, so a change to the wire format
# (anything under schema/) has to come with a major bump. Edits that don't change the wire format (wording fixes)
# opt out with the `schema-compatible` PR label. Compared against VERSION on main, not the PR's base branch, so
# several PRs into dev can share one bump.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check VERSION
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          re='^[0-9]+\.[0-9]+$'
          [ -f VERSION ] || { echo "::error::VERSION file is missing"; exit 1; }
          new="$(tr -d '[:space:]' < VERSION)"
          [[ "$new" =~ $re ]] || { echo "::error::VERSION must be MAJOR.MINOR (got '$new')"; exit 1; }

          # The released baseline is VERSION on main (0.0 if main doesn't have the file yet).
          git fetch --no-tags origin main
          released="$(git show origin/main:VERSION 2>/dev/null | tr -d '[:space:]' || true)"
          [[ "$released" =~ $re ]] || released="0.0"

          new_major="${new%%.*}"; new_minor="${new##*.}"
          old_major="${released%%.*}"; old_minor="${released##*.}"
          echo "VERSION: $new (main: $released)"

          if (( new_major < old_major || (new_major == old_major && new_minor < old_minor) )); then
            echo "::error::VERSION $new is lower than $released on main"
            exit 1
          fi

          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF"...HEAD -- schema | grep -q .; then
            echo "schema/ changed in this PR"
            if echo "$LABELS" | grep -q '"schema-compatible"'; then
              echo "labelled schema-compatible: major bump not required"
            elif (( new_major <= old_major )); then
              echo "::error::schema/ changed but VERSION's major ($new_major) is not above main's ($old_major). Bump the major in VERSION, or add the 'schema-compatible' label if the wire format is unchanged."
              exit 1
            fi
          fi
