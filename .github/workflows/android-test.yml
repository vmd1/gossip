name: Android Test

on:
  push:
    # Every branch, including main — tests must run on every commit regardless of branch.
    # Building/uploading an artifact is android-build.yml's job, gated to non-main
    # branches only (release.yml handles the main-only release build).
    paths:
      - "android/**"
      - "schema/**"
      - ".github/workflows/android-test.yml"
  pull_request:
    paths:
      - "android/**"
      - "schema/**"
      - ".github/workflows/android-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest
