name: Android Build

on:
  push:
    # Non-main branches only — a push to main is a release, and release.yml already
    # builds+publishes the release APK; a second unsigned debug build+upload on the same
    # main push would be redundant. android-test.yml still runs tests on every branch,
    # main included.
    branches-ignore: [main]
    paths:
      - "android/**"
      - "schema/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "schema/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gossip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
