name: Android CI

# One job per change: unit tests and the debug build share a single Gradle invocation (the
# build is what the tests compile anyway), instead of two parallel runners doing the same work.
# Runs on pull requests (and manually) only — a push to a branch with an open PR used to trigger
# a second, duplicate run via `push`, and merges to main were already tested on the PR.
on:
  pull_request:
    paths:
      - "android/**"
      - "schema/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# A newer push to the same PR supersedes the run in flight.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      # The APK is only uploaded when someone asks for it (Run workflow), not on every PR push.
      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gossip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
