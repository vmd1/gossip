name: Android CI

# One job per change: unit tests and the debug build share a single Gradle invocation (the
# build is what the tests compile anyway), instead of two parallel runners doing the same work.
# The debug APK is uploaded on every run.
# Runs on pull requests (and manually) only — a push to a branch with an open PR used to trigger
# a second, duplicate run via `push`, and merges to main were already tested on the PR.
on:
  pull_request:
    paths:
      - "android/**"
      - "desktop/**"
      - "schema/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# A newer push to the same PR supersedes the run in flight.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # The app's protocol engine is the Rust core (desktop/core). Gradle builds it (scripts/build-android.sh) with the NDK
      # that ships on the runner, so the toolchain, the four Android targets and cargo-ndk are needed first.
      - name: Install the Rust toolchain and the Android targets
        working-directory: desktop
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
          shared-key: android

      # After the cache restore, so the cached cargo-ndk binary is found and only built the first time.
      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # -PrebuildCore: the generated Kotlin bindings and libraries live under desktop/target, which the Rust cache restores,
      # and Gradle skips building the core when they are already there. Force it, so a restored copy can never be stale
      # (cargo itself is incremental, so this costs little).
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug -PrebuildCore

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gossip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
