name: Android CI

# One job per change: unit tests and the debug build share a single Gradle invocation (the
# build is what the tests compile anyway), instead of two parallel runners doing the same work.
# The debug APK is uploaded on every run.
# Runs on pull requests (and manually) only — a push to a branch with an open PR used to trigger
# a second, duplicate run via `push`, and merges to main were already tested on the PR.
on:
  pull_request:
    paths:
      - "android/**"
      - "schema/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# A newer push to the same PR supersedes the run in flight.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gossip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
