name: Android

on:
  push:
    # Every branch, not just main — see CLAUDE.md/the CI handoff: build+test must run on
    # every push, with an additional release step gated separately (release.yml) on main
    # specifically.
    paths:
      - "android/**"
      - "schema/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "schema/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gossip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
