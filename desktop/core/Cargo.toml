[package]
name = "gossip-core"
description = "Sans-IO core of the Gossip wire protocol: Noise_IK, framing, envelopes, mesh, trust and reconciliation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
getrandom = { version = "0.3", optional = true }

[features]
default = ["system-env"]
# `SystemEnv`: wall clock plus OS randomness. Disable for wasm or fully deterministic builds.
system-env = ["dep:getrandom"]

[dev-dependencies]
hex = "0.4"
