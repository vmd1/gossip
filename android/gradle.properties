org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 8.7.3's jlink-based JdkImageTransform (core-for-system-modules.jar against
# android-36) fails under JDK 27 — the only JDK `java_home` has registered on this
# machine. JDK 17 (Homebrew's `openjdk@17`) is already installed but not symlinked
# into `java_home`'s registry, so Gradle silently picked up 27 without this. Adjust
# this path if your JDK 17 lives elsewhere (e.g. `brew --prefix openjdk@17`).
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
